<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SentinelX</title>
  <meta name="description" content="SentinelX — AI ATM security intelligence platform">
  <link rel="icon" href="{{ url_for('static', filename='img/sentinelx-mark.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sentinelx.css') }}">
</head>
<body data-mode="{{ mode }}" data-csrf="{{ csrf or '' }}"
      data-user="{{ user.username if user else '' }}" data-role="{{ user.role if user else 'viewer' }}">
<a class="skip-link" href="#content">Skip to content</a>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <a class="brand" href="#/overview" aria-label="SentinelX home">
      <img class="brand-mark" src="{{ url_for('static', filename='img/sentinelx-mark.svg') }}" alt="">
      <span><span class="brand-name">Sentinel<b>X</b></span><span class="brand-sub">ATM security intelligence</span></span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sidebar-foot">
      {% if mode == 'demo' %}
      <span class="mode-pill demo" title="Precomputed demonstration data — no live cameras">Demo data</span>
      <span>Serverless demo: replays precomputed detections. Run locally for live cameras and incidents.</span>
      {% else %}
      <span class="mode-pill live">Live platform</span>
      <span id="foot-user"></span>
      {% endif %}
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn icon-btn ghost menu-btn" id="menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
      <div>
        <h1 id="view-title">Overview</h1>
        <div class="crumb" id="view-sub"></div>
      </div>
      <div class="topbar-right">
        <span class="clock tnum" id="clock" aria-hidden="true"></span>
        <button class="btn icon-btn" id="theme-btn" aria-label="Toggle colour theme"></button>
        {% if mode != 'demo' %}
        <button class="btn icon-btn" id="logout-btn" aria-label="Sign out"></button>
        {% endif %}
      </div>
    </header>
    <div id="banner-slot" aria-live="assertive"></div>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
<script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
