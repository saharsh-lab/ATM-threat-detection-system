# SentinelX model registry.
#
# Each entry is a versioned, reproducible model. `schema` is either `coco`
# (COCO-80 ids, mapped through YOLO_CLASSES / data/registry/classes.yaml) or a
# SentinelX class-schema version. Evaluation numbers live in the referenced
# report — they are produced by ml/evaluate_detector.py, never typed by hand.
models:
  - id: yolov8n-coco
    name: YOLOv8n (COCO-80, Ultralytics pretrained) — original baseline
    weights: yolov8n.pt
    sha256: f59b3d833e2ff32e194b5bb8e08d211dc7c5bdf144b90d2c8412c47ccfc83b36
    schema: coco
    source: https://github.com/ultralytics/assets/releases (yolov8n.pt, AGPL-3.0)

  - id: sentinelx-det-v1
    name: SentinelX detector v1 (YOLOv8n fine-tuned, 9 classes)
    weights: models/sentinelx-det-v1.pt
    sha256: f256db90266b2a04a80cf5f6bbeac2a9c4e7876b93b19939a196b4a9590f571d
    schema: sentinelx-classes-v1
    base: yolov8n-coco
    dataset_id: openimages_v7_sentinelx_v1
    dataset_version: 6495ad20fbf022c7
    train_config: ml/configs/train_v1.yaml
    training_report: reports/training/sentinelx-det-v1/train_meta.json
    evaluation_report: reports/detector/report.json
    default: true
